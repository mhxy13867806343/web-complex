<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>俄罗斯方块 · WorkBuddy PC</title>
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  .main { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; justify-content:center;
    max-width:860px; margin:0 auto; padding:16px 14px 36px; }
  canvas { display:block; border-radius:12px; background:#10141f; }
  .side { display:flex; flex-direction:column; gap:12px; width:180px; }
  @media (max-width:640px) {
    .main { flex-direction:column; align-items:center; }
    .side { width:100%; max-width:320px; flex-direction:row; flex-wrap:wrap; justify-content:space-between; }
    .side .panel { flex:1 1 45%; }
    .side .panel.keys { display:none; }
  }
  .panel { background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .panel h3 { margin:0 0 8px; font-size:12px; color:var(--txt-1); font-weight:600; letter-spacing:1px; }
  .panel canvas { background:transparent; margin:0 auto; }
  .stat { display:flex; justify-content:space-between; font-size:13px; line-height:1.9; }
  .stat b { font-variant-numeric:tabular-nums; }
  .keys { font-size:12px; color:var(--txt-1); line-height:2; }
  kbd { background:var(--bg-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px;
    padding:1px 6px; font-size:11px; font-family:inherit; }
  .overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(8,12,22,.88); border-radius:12px; backdrop-filter:blur(4px); text-align:center; padding:20px; z-index:10; }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:26px; }
  .overlay p { margin:0; color:var(--txt-1); font-size:13px; line-height:1.8; }
  .stage { position:relative; display:flex; flex-direction:column; align-items:center; }
  .touch-bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; width:100%; max-width:320px; user-select:none; -webkit-user-select:none; }
  .tbtn { flex:1 1 calc(33.33% - 8px); min-width:70px; height:46px; background:var(--bg-1); border:1px solid var(--line); color:var(--txt-0); border-radius:10px; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; }
  .tbtn:active { background:var(--acc); color:#fff; transform:scale(0.96); }
  .tbtn.primary { background:rgba(79,140,255,.2); border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>

<div class="topbar">
  <a class="btn sm ghost" href="../index.html">← 返回</a>
  <span class="title">俄罗斯方块</span>
  <span class="spacer"></span>
  <button class="btn sm ghost" id="btnPause">⏸ 暂停</button>
  <button class="btn sm ghost" id="btnSound">🔊</button>
</div>

<div class="main">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="touch-bar" id="touchBar">
      <button type="button" class="tbtn" data-act="hold">📦 暂存</button>
      <button type="button" class="tbtn" data-act="left">◀ 左移</button>
      <button type="button" class="tbtn" data-act="rotate">🔄 旋转</button>
      <button type="button" class="tbtn" data-act="right">▶ 右移</button>
      <button type="button" class="tbtn" data-act="down">▼ 软降</button>
      <button type="button" class="tbtn primary" data-act="drop">⏬ 硬降</button>
    </div>
    <div class="overlay show" id="menu">
      <h2>🧱 俄罗斯方块</h2>
      <p><kbd>←→</kbd> 移动 · <kbd>↓</kbd> 软降 · <kbd>↑</kbd>/<kbd>X</kbd> 旋转 · <kbd>Z</kbd> 反转<br>
        <kbd>空格</kbd> 硬降 · <kbd>C</kbd> 暂存 · <kbd>P</kbd> 暂停<br>
        <span style="color:var(--acc)">手机/触屏支持下方虚拟按键及划动手势！</span></p>
      <button class="btn primary" id="btnStart" style="padding:10px 28px;font-size:16px;">开始游戏</button>
    </div>
    <div class="overlay" id="over">
      <h2 id="overT">游戏结束</h2>
      <p id="overP"></p>
      <button class="btn primary" id="btnAgain">再来一局</button>
    </div>
  </div>

  <div class="side">
    <div class="panel"><h3>下一个</h3><canvas id="next" width="120" height="120"></canvas></div>
    <div class="panel"><h3>暂存 (C)</h3><canvas id="hold" width="120" height="120"></canvas></div>
    <div class="panel">
      <div class="stat"><span>分数</span><b id="score">0</b></div>
      <div class="stat"><span>消行</span><b id="lines">0</b></div>
      <div class="stat"><span>等级</span><b id="level">1</b></div>
      <div class="stat"><span>最高</span><b id="best">0</b></div>
    </div>
    <div class="panel keys">
      <kbd>←→</kbd>移动 <kbd>↓</kbd>软降<br>
      <kbd>↑</kbd>旋转 <kbd>Z</kbd>反转<br>
      <kbd>空格</kbd>硬降 <kbd>C</kbd>暂存
    </div>
  </div>
</div>

<script src="../../shared/audio.js"></script>
<script>
(function () {
  'use strict';
  var COLS = 10, ROWS = 20, CELL = 30;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  cv.width = COLS * CELL; cv.height = ROWS * CELL;
  var ncv = document.getElementById('next'), nctx = ncv.getContext('2d');
  var hcv = document.getElementById('hold'), hctx = hcv.getContext('2d');
  function el(id) { return document.getElementById(id); }

  // 7 种四格骨牌：相对坐标 + 配色
  var SHAPES = {
    I: { c: '#22d3ee', b: [[0,1],[1,1],[2,1],[3,1]] },
    O: { c: '#facc15', b: [[1,0],[2,0],[1,1],[2,1]] },
    T: { c: '#a78bfa', b: [[1,0],[0,1],[1,1],[2,1]] },
    S: { c: '#4ade80', b: [[1,0],[2,0],[0,1],[1,1]] },
    Z: { c: '#f87171', b: [[0,0],[1,0],[1,1],[2,1]] },
    J: { c: '#60a5fa', b: [[0,0],[0,1],[1,1],[2,1]] },
    L: { c: '#fb923c', b: [[2,0],[0,1],[1,1],[2,1]] }
  };
  var KEYS = Object.keys(SHAPES);
  var SCORES = [0, 100, 300, 500, 800]; // 0~4 行

  var grid, cur, nextQ, hold, canHold, score, lines, level, best, running, paused, dropAcc, dropMs, lockFlash;

  best = +(localStorage.getItem('wb-tetris-best') || 0);
  el('best').textContent = best;

  function newGrid() { var g = []; for (var r = 0; r < ROWS; r++) { g.push([]); for (var c = 0; c < COLS; c++) g[r].push(null); } return g; }

  function bag() { // 7-bag 随机发牌
    var a = KEYS.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function spawn() {
    if (!nextQ.length) nextQ = bag();
    var k = nextQ.shift();
    if (nextQ.length < 7) nextQ = nextQ.concat(bag());
    var s = SHAPES[k];
    cur = { k: k, b: s.b.map(function (p) { return [p[0], p[1]]; }), x: 3, y: -1 };
    canHold = true;
    if (collide(cur.b, cur.x, cur.y)) { gameOver(); }
  }

  function collide(b, ox, oy) {
    for (var i = 0; i < b.length; i++) {
      var x = ox + b[i][0], y = oy + b[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function rotate(dir) {
    if (cur.k === 'O') return;
    var nb = cur.b.map(function (p) { return dir > 0 ? [3 - p[1], p[0]] : [p[1], 3 - p[0]]; });
    // 简单踢墙：尝试 0 / ±1 / ±2 横移
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collide(nb, cur.x + kicks[i], cur.y)) { cur.b = nb; cur.x += kicks[i]; WB.sfx.play('tap'); return; }
    }
    WB.sfx.play('error');
  }

  function move(dx) { if (!collide(cur.b, cur.x + dx, cur.y)) { cur.x += dx; WB.sfx.play('move'); } }

  function softDrop() {
    if (!collide(cur.b, cur.x, cur.y + 1)) { cur.y++; score += 1; dropAcc = 0; }
    else lockPiece();
  }

  function hardDrop() {
    var d = 0;
    while (!collide(cur.b, cur.x, cur.y + 1)) { cur.y++; d++; }
    score += d * 2;
    WB.sfx.play('drop');
    lockPiece();
  }

  function ghostY() { var y = cur.y; while (!collide(cur.b, cur.x, y + 1)) y++; return y; }

  function doHold() {
    if (!canHold) { WB.sfx.play('error'); return; }
    var k = cur.k;
    if (hold) { var t = hold; hold = k; spawnFrom(t); }
    else { hold = k; spawn(); }
    canHold = false;
    WB.sfx.play('undo');
    drawMini(hctx, hold);
  }
  function spawnFrom(k) {
    var s = SHAPES[k];
    cur = { k: k, b: s.b.map(function (p) { return [p[0], p[1]]; }), x: 3, y: -1 };
    if (collide(cur.b, cur.x, cur.y)) gameOver();
  }

  function lockPiece() {
    for (var i = 0; i < cur.b.length; i++) {
      var x = cur.x + cur.b[i][0], y = cur.y + cur.b[i][1];
      if (y < 0) { gameOver(); return; }
      grid[y][x] = SHAPES[cur.k].c;
    }
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(function (v) { return v; })) {
        grid.splice(r, 1);
        grid.unshift(newGrid()[0]);
        cleared++; r++;
      }
    }
    if (cleared) {
      lines += cleared;
      score += SCORES[cleared] * level;
      var nl = Math.floor(lines / 10) + 1;
      if (nl > level) { level = nl; dropMs = speedFor(level); WB.sfx.play('combo', level); }
      WB.sfx.play('clear');
      lockFlash = 0.18;
    } else {
      WB.sfx.play('tick');
    }
    spawn();
    updateHUD();
  }

  function speedFor(lv) { return Math.max(70, 800 * Math.pow(0.82, lv - 1)); }

  function gameOver() {
    running = false;
    if (score > best) { best = score; localStorage.setItem('wb-tetris-best', best); el('best').textContent = best; }
    el('overT').textContent = '游戏结束';
    el('overP').innerHTML = '得分 <b style="color:var(--acc)">' + score + '</b> · 消行 ' + lines + ' · 等级 ' + level +
      (score >= best && score > 0 ? '<br>🏆 新纪录！' : '');
    el('over').classList.add('show');
    WB.sfx.play('lose');
  }

  function newGame() {
    grid = newGrid(); nextQ = []; hold = null; canHold = true;
    score = 0; lines = 0; level = 1; dropMs = speedFor(1); dropAcc = 0; lockFlash = 0;
    running = true; paused = false;
    hctx.clearRect(0, 0, 120, 120);
    spawn(); updateHUD();
    WB.sfx.play('start');
  }

  function updateHUD() {
    el('score').textContent = score;
    el('lines').textContent = lines;
    el('level').textContent = level;
  }

  // ---------- 绘制 ----------
  function cell(g, x, y, col, alpha) {
    g.globalAlpha = alpha == null ? 1 : alpha;
    g.fillStyle = col;
    g.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    g.fillStyle = 'rgba(255,255,255,.22)';
    g.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 4);
    g.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    for (var r = 1; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(cv.width, r * CELL); ctx.stroke(); }
    for (var c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, cv.height); ctx.stroke(); }
    // 已锁定
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) if (grid[y][x]) cell(ctx, x, y, grid[y][x], lockFlash > 0 ? 0.75 : 1);
    if (running && cur) {
      var gy = ghostY();
      for (var i = 0; i < cur.b.length; i++) {
        var gx = cur.x + cur.b[i][0], gyy = gy + cur.b[i][1];
        if (gyy >= 0) cell(ctx, gx, gyy, SHAPES[cur.k].c, 0.18);
      }
      for (var j = 0; j < cur.b.length; j++) {
        var px = cur.x + cur.b[j][0], py = cur.y + cur.b[j][1];
        if (py >= 0) cell(ctx, px, py, SHAPES[cur.k].c);
      }
    }
    if (paused) {
      ctx.fillStyle = 'rgba(8,12,22,.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#e5e9f2'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('已暂停 (P 继续)', cv.width / 2, cv.height / 2);
    }
    // 下一个
    nctx.clearRect(0, 0, 120, 120);
    if (nextQ.length) drawMini(nctx, nextQ[0]);
  }

  function drawMini(g, k) {
    if (!k) return;
    var s = SHAPES[k], min = [9, 9], max = [-9, -9];
    s.b.forEach(function (p) { min[0] = Math.min(min[0], p[0]); min[1] = Math.min(min[1], p[1]); max[0] = Math.max(max[0], p[0]); max[1] = Math.max(max[1], p[1]); });
    var w = max[0] - min[0] + 1, h = max[1] - min[1] + 1, cs = 22;
    var ox = (120 - w * cs) / 2, oy = (120 - h * cs) / 2;
    g.clearRect(0, 0, 120, 120);
    s.b.forEach(function (p) {
      var x = ox + (p[0] - min[0]) * cs, y = oy + (p[1] - min[1]) * cs;
      g.fillStyle = s.c; g.fillRect(x + 1, y + 1, cs - 2, cs - 2);
      g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(x + 1, y + 1, cs - 2, 3);
    });
  }

  // ---------- 主循环 ----------
  var last = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
    if (running && !paused) {
      if (lockFlash > 0) lockFlash -= dt;
      dropAcc += dt * 1000;
      if (dropAcc >= dropMs) { dropAcc = 0; softDropNoScore(); }
    }
    draw();
  }
  function softDropNoScore() {
    if (!collide(cur.b, cur.x, cur.y + 1)) cur.y++;
    else lockPiece();
  }

  // ---------- 输入 ----------
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
    if (k === 'p' && running) { paused = !paused; return; }
    if (!running || paused) return;
    if (k === 'arrowleft' || k === 'a') move(-1);
    else if (k === 'arrowright' || k === 'd') move(1);
    else if (k === 'arrowdown' || k === 's') { softDrop(); updateHUD(); }
    else if (k === 'arrowup' || k === 'x' || k === 'w') rotate(1);
    else if (k === 'z') rotate(-1);
    else if (k === ' ') { hardDrop(); updateHUD(); }
    else if (k === 'c') doHold();
  });

  // ---------- 触屏与手势控制 ----------
  var tbar = el('touchBar');
  if (tbar) {
    tbar.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('.tbtn');
      if (!b) return;
      e.preventDefault();
      WB.sfx.unlock();
      if (!running || paused) return;
      var act = b.getAttribute('data-act');
      if (act === 'left') move(-1);
      else if (act === 'right') move(1);
      else if (act === 'down') { softDrop(); updateHUD(); }
      else if (act === 'rotate') rotate(1);
      else if (act === 'drop') { hardDrop(); updateHUD(); }
      else if (act === 'hold') doHold();
    });
  }

  var touchX = 0, touchY = 0, touchT = 0, moved = false;
  cv.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY; touchT = Date.now(); moved = false;
    WB.sfx.unlock();
  }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    if (!running || paused || e.touches.length !== 1) return;
    var t = e.touches[0];
    var dx = t.clientX - touchX;
    var dy = t.clientY - touchY;
    if (Math.abs(dx) > 26) {
      move(dx > 0 ? 1 : -1);
      touchX = t.clientX;
      moved = true;
    }
    if (dy > 32) {
      softDrop(); updateHUD();
      touchY = t.clientY;
      moved = true;
    }
  }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    if (!running || paused) return;
    var dt = Date.now() - touchT;
    if (!moved && dt < 280) {
      rotate(1);
    }
  });

  el('btnStart').onclick = function () { el('menu').classList.remove('show'); newGame(); };
  el('btnAgain').onclick = function () { el('over').classList.remove('show'); newGame(); };
  el('btnPause').onclick = function () { if (running) paused = !paused; };
  el('btnSound').onclick = function () { var on = WB.sfx.toggle(); this.textContent = on ? '🔊' : '🔇'; };

  grid = newGrid(); nextQ = []; running = false; paused = false;
  score = 0; lines = 0; level = 1; dropMs = 800; dropAcc = 0; lockFlash = 0; hold = null; cur = null;
  requestAnimationFrame(loop);

  // #autostart：无头自动验证（自动开局 + 模拟操作）
  if (/autostart/.test(location.hash)) {
    el('menu').classList.remove('show');
    newGame();
    var step = 0;
    setInterval(function () {
      if (!running || paused) return;
      step++;
      move(step % 2 ? 1 : -1);
      if (step % 3 === 0) rotate(1);
      if (step % 5 === 0) { hardDrop(); updateHUD(); }
      if (step % 11 === 0) doHold();
    }, 200);
  }
})();
</script>
</body>
</html>
